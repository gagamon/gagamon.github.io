<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f5f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0da;
      border-radius: 12px;
      padding: 2rem 2.25rem;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #333;
    }
    h2 { font-size: 18px; font-weight: 500; margin-bottom: 0.4rem; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.75rem; }
    label { font-size: 13px; color: #888; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: #aaa; }
    .forgot {
      display: block;
      font-size: 12px;
      color: #888;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 1.25rem;
      text-decoration: none;
    }
    .btn-login {
      width: 100%;
      height: 38px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-login:hover { opacity: 0.85; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.25rem 0;
      font-size: 12px;
      color: #aaa;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }
    .signup { text-align: center; font-size: 13px; color: #888; }
    .signup a { color: #222; font-weight: 500; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⬡ portfolio</div>
    <h2>ログイン</h2>
    <p class="sub">アカウントにサインインしてください</p>

    <label for="email">メールアドレス</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <label for="password">パスワード</label>
    <input type="password" id="password" placeholder="••••••••" />

    <a href="#" class="forgot">パスワードを忘れた方</a>

    <button class="btn-login">ログイン</button>

    <div class="divider">または</div>

    <p class="signup">アカウントをお持ちでない方は <a href="#">新規登録</a></p>
  </div>
  <a href="/" style="text-decoration: none;">
    <button style="
      margin-top: 12px;
      width: 100%;
      height: 38px;
      background: transparent;
      color: #222;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    ">← トップに戻る</button>
  </a>
</body>
</html>
